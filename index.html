<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURAMA SUSHI</title>

<style>
:root{
  --vino:#7d2630;
  --vino2:#a43b42;
  --dorado:#c79b55;
  --crema:#f5ead6;
  --papel:#fff9ed;
  --marron:#3b241d;
  --texto:#291c18;
  --verde:#355c45;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--texto);
  background:
    radial-gradient(circle at 15% 20%,rgba(199,155,85,.18),transparent 25%),
    linear-gradient(135deg,#291813,#5b3024 45%,#241510);
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(43,25,19,.97);
  border-bottom:2px solid var(--dorado);
  box-shadow:0 5px 20px #0008;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  color:white;
  font-weight:bold;
  letter-spacing:3px;
  font-size:20px;
}

.logo small{
  display:block;
  color:var(--dorado);
  font-size:10px;
  letter-spacing:4px;
  text-align:center;
}

.cart-button{
  border:0;
  background:var(--vino2);
  color:white;
  border-radius:30px;
  padding:11px 16px;
  font-weight:bold;
  cursor:pointer;
}

.cart-count{
  background:white;
  color:var(--vino);
  border-radius:50%;
  padding:3px 7px;
  margin-left:5px;
}

nav{
  max-width:1200px;
  margin:auto;
  padding:0 10px 12px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

nav a{
  color:white;
  text-decoration:none;
  background:#ffffff18;
  padding:8px 12px;
  border-radius:20px;
  white-space:nowrap;
  font-size:14px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px 14px 60px;
}

section{
  margin-bottom:45px;
  scroll-margin-top:120px;
}

.section-title{
  color:var(--crema);
  font-size:28px;
  margin:0 0 6px;
}

.section-subtitle{
  color:#f0d7b2;
  margin:0 0 18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:16px;
}

.card{
  background:var(--papel);
  border-radius:16px;
  padding:18px;
  box-shadow:0 8px 25px #0007;
  border:1px solid #d9c29c;
}

.card h3{
  margin:0 0 7px;
  color:var(--vino);
}

.description{
  color:#684d43;
  font-size:14px;
  line-height:1.4;
  min-height:40px;
}

.price{
  color:var(--vino);
  font-size:21px;
  font-weight:bold;
  margin:12px 0;
}

.actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.qty{
  display:flex;
  border:1px solid #c9ad7e;
  border-radius:8px;
  overflow:hidden;
}

  border:0;
  background:#f2e3ca;
  width
